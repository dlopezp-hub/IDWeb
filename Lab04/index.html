<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas Universitarias</title>
  <!-- Estilos de Bootstrap para una interfaz limpia -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .completada {
      text-decoration: line-through;
      color: #6c757d;
    }
  </style>
</head>
<body class="bg-light p-4">

  <div class="container" style="max-width: 600px;">
    <h2 class="mb-4 text-center">Gestor de Tareas Universitarias</h2>

    <!-- mensajes de error/alerta -->
    <div id="alerta" class="alert alert-danger d-none" role="alert"></div>

    <!-- Formularioo -->
    <form id="form-tarea" class="card card-body mb-4 shadow-sm">
      <div class="mb-3">
        <label for="titulo" class="form-label">Título de la tarea</label>
        <input type="text" id="titulo" class="form-control" placeholder="Ej. Informe de Laboratorio">
      </div>
      <div class="mb-3">
        <label for="curso" class="form-label">Curso</label>
        <input type="text" id="curso" class="form-control" placeholder="Ej. Desarrollo Web">
      </div>
      <div class="mb-3">
        <label for="fechaEntrega" class="form-label">Fecha de Entrega</label>
        <input type="date" id="fechaEntrega" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Agregar Tarea</button>
    </form>

    <!-- ver las tareas -->
    <div class="btn-group mb-3 w-100" role="group">
      <button class="btn btn-outline-secondary active" onclick="filtrarTareas('todas')">Todas</button>
      <button class="btn btn-outline-secondary" onclick="filtrarTareas('pendientes')">Pendientes</button>
      <button class="btn btn-outline-secondary" onclick="filtrarTareas('completadas')">Completadas</button>
    </div>

    <!-- tareas -->
    <ul id="lista-tareas" class="list-group shadow-sm"></ul>
  </div>
</body>
</html>
