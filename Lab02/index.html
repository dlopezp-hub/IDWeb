<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Académica - Registro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="card-container">
        <header class="form-header">
            <h1>Registro de Estudiantes</h1>
            <p>Sistema de Gestión Académica</p>
        </header>

        <form action="/procesar" method="POST" class="academic-form">
            
            <!-- Bloque 1: Información Personal -->
            <fieldset>
                <legend>Información Personal</legend>

                <div class="form-group">
                    <label for="codigo" class="form-label">Código de Estudiante (8 dígitos):</label>
                    <input type="text" id="codigo" name="codigo" class="form-input" 
                           required pattern="[0-9]{8}" placeholder="Ej. 75948710" title="Debe contener exactamente 8 números.">
                </div>

                <div class="form-group">
                    <label for="nombre" class="form-label">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" class="form-input" required placeholder="Tu Nombre y Apellido">
                </div>

                <div class="form-group">
                    <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento:</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" class="form-input" 
                           required min="1950-01-01" max="2010-12-31">
                </div>

                <div class="form-group">
                    <label for="carrera" class="form-label">Carrera Profesional:</label>
                    <select id="carrera" name="carrera" class="form-input" required>
                        <option value=""> Seleccione una carrera </option>
                        <option value="sistemas">Ingeniería de Sistemas</option>
                        <option value="software">Ingeniería de Software</option>
                        <option value="industrial">Ingeniería Industrial</option>
                    </select>
                </div>
            </fieldset>

            <!--Información de la Cuenta -->
            <fieldset>
                <legend>Información de la Cuenta</legend>

                <div class="form-group">
                    <label for="email" class="form-label">Correo Institucional:</label>
                    <input type="email" id="email" name="email" class="form-input" 
                           required placeholder="usuario@universidad.edu.pe">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña (Mayúscula, número y mín. 8 caracteres):</label>
                    <input type="password" id="password" name="password" class="form-input" 
                           required pattern="(?=.*\d)(?=.*[A-Z]).{8,}" 
                           placeholder="••••••••" title="Mínimo 8 caracteres, al menos una mayúscula y un número.">
                </div>

                <div class="form-group">
                    <label class="form-label">Turno de Estudio:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="turno" value="mañana" required> Mañana</label>
                        <label><input type="radio" name="turno" value="tarde"> Tarde</label>
                        <label><input type="radio" name="turno" value="noche"> Noche</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comentarios" class="form-label">Comentarios / Observaciones:</label>
                    <textarea id="comentarios" name="comentarios" class="form-input" rows="3" placeholder="Escribe aquí tus observaciones..."></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="terminos" name="terminos" required> 
                        Acepto los términos y condiciones del sistema.
                    </label>
                </div>
            </fieldset>

            <button type="submit" class="btn-submit">Registrar Estudiante</button>
        </form>
    </main>

</body>
</html>
